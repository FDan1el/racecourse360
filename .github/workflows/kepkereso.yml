name: Képkeresés (Wikimedia Commons)

on:
  workflow_dispatch:
    inputs:
      orszag:
        description: 'Országkód (pl. FRA, SRB)'
        required: true
        default: 'FRA'
      limit:
        description: 'Max hány pálya (üres = mind)'
        required: false
        default: ''

jobs:
  kepkereses:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repó letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Képkeresés futtatása
        run: node tools/kepkereso.mjs "${{ inputs.orszag }}" ${{ inputs.limit }}

      # if: always() — a részeredmény akkor is letölthető,
      # ha a futás timeoutolt vagy hibára futott.
      - name: Eredmény feltöltése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kepek
          path: eredmeny/
          retention-days: 30
          if-no-files-found: warn
