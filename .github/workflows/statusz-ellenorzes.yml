name: Státuszellenőrzés

# ============================================================
#  MIT CSINÁL
#  Végigmegy MINDEN ország pályáin, és a hivatalos
#  versenynaptárakból megnézi, van-e friss versenynapjuk.
#  Ha eltérést talál a tárolt státusztól, Issue-t nyit.
#
#  MIÉRT ITT FUT, ÉS NEM KÉZZEL
#  A fejlesztői környezetnek nincs szabad kimenő hálózata –
#  a szövetségi oldalakat csak a GitHub futtatója éri el.
#  Ezért az ellenőrzés helye ez a workflow, nem a laptop.
#
#  MIT NEM CSINÁL
#  Soha nem írja át az app.js-t. A státusz emberi döntés marad.
#
#  A LEGFONTOSABB SZABÁLY, AMIT A SZKRIPT BETART
#  Ha egy országnál egyetlen versenynaptárat sem sikerült elérni
#  (botvédelem, robots.txt tiltás, halott cím), akkor NEM javasol
#  státuszváltozást. A bizonyíték hiánya nem a hiány bizonyítéka:
#  korábban épp ettől minősült volna inaktívnak a Melton, ahol az
#  A.G. Hunter Cupot futják.
# ============================================================

on:
  schedule:
    # Minden hónap 8-án 04:00 UTC. Nem 1-jén: akkor fut a havi
    # adatellenőrzés, és nem érdemes egy napra tenni a kettőt.
    - cron: '0 4 8 * *'
  workflow_dispatch:
    inputs:
      orszag:
        description: 'Országkód (üresen: MIND)'
        required: false
        default: ''
      honapok:
        description: 'Hány hónapra visszamenőleg keressen versenynapot?'
        required: false
        default: '12'

permissions:
  contents: read
  issues: write

jobs:
  statusz:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Repó letöltése
        uses: actions/checkout@v4

      - name: Node beállítása
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ellenőrzés futtatása
        continue-on-error: true
        run: |
          ORSZAG="${{ github.event.inputs.orszag }}"
          [ -z "$ORSZAG" ] && ORSZAG="MIND"
          HONAPOK="${{ github.event.inputs.honapok }}"
          [ -z "$HONAPOK" ] && HONAPOK="12"
          echo "Futtatás: --orszag $ORSZAG --honapok $HONAPOK"
          node tools/statusz.mjs --orszag "$ORSZAG" --honapok "$HONAPOK" || true

      - name: Jelentések megőrzése
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statusz-${{ github.run_number }}
          path: |
            tools/statusz-jelentes*.csv
            tools/statusz-jelentes*.md
            elteresek.txt
            bizonytalanok.txt
          retention-days: 90

      - name: Eltérések kigyűjtése
        id: elteres
        if: always()
        run: |
          # ==========================================================
          #  MI SZÁMÍT ELTÉRÉSNEK, ÉS MI NEM
          # ----------------------------------------------------------
          #  A szkript háromféle javaslatot adhat:
          #    konkrét státusz (active / inactive / closed)
          #        -> ez VERDIKT. Ha eltér a tárolttól, az eltérés.
          #    "unknown"
          #        -> ez NEM VERDIKT, hanem az, hogy nem sikerült
          #           elég bizonyítékot találni. Tehát NEM eltérés.
          #    a tárolt státusz változatlanul (nem ellenőrizhető)
          #        -> szintén nem eltérés, mert azonos.
          #
          #  EZ A JAVÍTÁS LÉNYEGE. A 2026-11-23-i első teljes futás
          #  538 "eltérést" jelentett a 655 rekordból – 82%-ot. Ebből
          #  97% "unknown" volt, vagyis "nem tudom". A két VALÓDI
          #  jelzés elveszett az 500+ soros zajban, pedig pont azokért
          #  fut ez az egész. Egy riasztás, ami mindenre riaszt,
          #  ugyanannyit ér, mint amelyik semmire.
          # ==========================================================
          : > elteresek.txt
          : > bizonytalanok.txt
          for f in tools/statusz-jelentes*.csv; do
            [ -e "$f" ] || continue
            # A CSV magyar fejlécű, pontosvesszős, és BOM-mal kezdődik –
            # a BOM-ot le kell vágni, különben az első oszlopnév nem
            # egyezik. Az oszlopok: Jelenlegi / Javasolt.
            node -e '
              const fs=require("fs");
              const f=process.argv[1], nev=f.split("/").pop();
              const sorok=fs.readFileSync(f,"utf8").replace(/^﻿/,"")
                            .split("\n").filter(Boolean);
              const fej=sorok.shift().split(";");
              const iJ=fej.indexOf("Jelenlegi"), iA=fej.indexOf("Javasolt");
              if(iJ<0||iA<0){ console.error("Ismeretlen fejléc: "+f); process.exit(0); }
              const ki=[], bizonytalan=[];
              for(const s of sorok){
                const c=s.split(";");
                if(!c[iJ]||!c[iA]) continue;
                const javaslat=c[iA].replace(/^"|"$/g,"").trim();
                if(javaslat==="unknown"){ bizonytalan.push(nev+" | "+s); continue; }
                if(c[iJ]!==c[iA]) ki.push(nev+" | "+s);
              }
              fs.writeFileSync(process.argv[2], ki.join("\n")+(ki.length?"\n":""), {flag:"a"});
              fs.writeFileSync(process.argv[3], bizonytalan.join("\n")+(bizonytalan.length?"\n":""), {flag:"a"});
            ' "$f" elteresek.txt bizonytalanok.txt || true
          done
          DB=$(grep -c . elteresek.txt || true);      DB=${DB:-0}
          BIZ=$(grep -c . bizonytalanok.txt || true); BIZ=${BIZ:-0}
          echo "Eltérés: $DB   Bizonytalan (unknown): $BIZ"
          echo "db=$DB" >> $GITHUB_OUTPUT
          echo "biz=$BIZ" >> $GITHUB_OUTPUT
          {
            echo 'reszletek<<VEGE'
            head -60 elteresek.txt
            echo 'VEGE'
          } >> $GITHUB_OUTPUT

      - name: Issue nyitása, ha van eltérés
        if: always() && steps.elteres.outputs.db != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const db = '${{ steps.elteres.outputs.db }}';
            const biz = '${{ steps.elteres.outputs.biz }}';
            const reszletek = `${{ steps.elteres.outputs.reszletek }}`;
            const datum = new Date().toLocaleDateString('hu-HU');
            const body = [
              `## Státuszellenőrzés – ${datum}`,
              ``,
              `A versenynaptárak alapján **${db} pályánál** tér el a javaslat a tárolt státusztól.`,
              ``,
              `### Mit jelent ez`,
              `A szkript a hivatalos versenynaptárakból nézte meg, volt-e friss versenynap.`,
              `Ahol egyetlen naptár sem volt elérhető, ott **nem** javasolt változást –`,
              `azok a sorok nincsenek is ebben a listában.`,
              ``,
              `**${biz} pályánál a javaslat \`unknown\` lett.** Ez NEM eltérés, és`,
              `szándékosan nincs a lenti listában: azt jelenti, hogy nem sikerült elég`,
              `bizonyítékot találni, nem azt, hogy a tárolt státusz rossz. Ezek a sorok`,
              `a \`bizonytalanok.txt\` fájlban vannak, az Artifacts szekcióban.`,
              ``,
              `### Eltérések`,
              ``,
              '```',
              reszletek,
              '```',
              ``,
              `A teljes, országonkénti CSV a futás **Artifacts** szekciójában:`,
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `---`,
              `> A szkript **nem módosította az app.js-t**. A státusz emberi döntés;`,
              `> a szabályt a js/app.js \`statuszSzoveg()\` fölötti blokk írja le.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Státuszellenőrzés: ${db} eltérés (${datum})`,
              body, labels: ['adatellenőrzés', 'automatikus'],
            });

      - name: Összegzés
        if: always()
        run: |
          {
            echo "## Státuszellenőrzés lefutott"
            echo ""
            echo "Eltérés a tárolt státusztól: **${{ steps.elteres.outputs.db }}**"
            echo ""
            echo "### Országok, ahol NEM volt elérhető versenynaptár"
            echo ""
            echo 'Ezeknél a futás nem mond semmit a pályákról – a forrás volt zárva.'
            echo '```'
            grep -l 'VERSENYNAPTÁR NEM VOLT ELÉRHETŐ' tools/statusz-jelentes*.md 2>/dev/null | sed 's#tools/statusz-jelentes-\?##; s#\.md##' || echo "(mind elérhető volt)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
