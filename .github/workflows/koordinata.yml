name: Koordináta-keresés (Excel alapján)

on:
  workflow_dispatch:
    inputs:
      excel:
        description: 'Excel útvonala a repóban'
        required: true
        default: 'tools/Racecourse_360.xlsx'
      munkalap:
        description: 'Munkalap neve'
        required: true
        default: 'Franciaország'

jobs:
  koordinata:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repó letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Függőség telepítése
        run: npm install xlsx

      - name: Koordináta-keresés futtatása
        run: node tools/koordinata.mjs "${{ inputs.excel }}" "${{ inputs.munkalap }}"

      - name: Eredmény feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: koordinatak
          path: eredmeny/
          retention-days: 30
