name: Havi adatellenőrzés

# ============================================================
#  MIT CSINÁL
#  Minden hónap 1-jén lefuttatja az adatellenőrzést, és ha
#  eltérést talál, NYIT EGY ISSUE-T a részletekkel.
#
#  MIT NEM CSINÁL
#  Soha nem módosítja az app.js-t. Minden változtatás emberi
#  döntés marad – a workflow csak jelez.
#
#  MIÉRT ÉRI MEG
#  A bezárt pályák és a halott linkek maguktól keletkeznek az
#  idő múlásával. A Rideau Carleton bezárását 2026 áprilisában
#  jelentették be – egy havi ellenőrzés egy hónapon belül
#  kiszúrta volna.
# ============================================================

on:
  schedule:
    # Minden hónap 1-jén 03:00 UTC-kor.
    # (A GitHub UTC-ben számol; nyáron ez 05:00 magyar idő.)
    - cron: '0 3 1 * *'
  # Kézzel is indítható az Actions fülről
  workflow_dispatch:
    inputs:
      orszagok:
        description: 'Országkódok szóközzel elválasztva (üresen: mind)'
        required: false
        default: ''

# Az Issue nyitásához írási jog kell
permissions:
  contents: read
  issues: write

jobs:
  ellenorzes:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repo letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fájlok keresése
        id: fajlok
        run: |
          echo "=== Repo tartalma ==="
          ls -la
          echo ""
          echo "=== verify.mjs keresése ==="
          SCRIPT=$(find . -name 'verify.mjs' -not -path './node_modules/*' | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "NEM TALÁLOM a verify.mjs-t sehol a repóban!"
            echo ""
            echo "Ezek a .mjs és .js fájlok vannak:"
            find . -name '*.mjs' -o -name '*.js' | grep -v node_modules | head -20
            echo ""
            echo "MEGOLDÁS: töltsd fel a verify.mjs-t a tools/ mappába."
            echo "FIGYELJ a kiterjesztésre: .mjs (nem .js, nem .mjs.txt)"
            exit 1
          fi
          echo "Megtaláltam: $SCRIPT"
          echo "script=$SCRIPT" >> $GITHUB_OUTPUT
          echo ""
          echo "=== Egyéb szükséges fájlok ==="
          # Az app.js bárhol lehet (gyökér, js/, src/ ...) – megkeressük
          APPJS=$(find . -name 'app.js' -not -path './node_modules/*' -not -path './tools/*' | head -1)
          if [ -z "$APPJS" ]; then
            echo "  HIÁNYZIK app.js  – ez kötelező!"
            exit 1
          fi
          echo "  OK       app.js         ->  $APPJS"
          echo "appjs=$APPJS" >> $GITHUB_OUTPUT

          UJP=$(find . -name 'uj_palyak.json' -not -path './node_modules/*' | head -1)
          if [ -n "$UJP" ]; then
            echo "  OK       uj_palyak.json ->  $UJP"
            echo "ujpalyak=$UJP" >> $GITHUB_OUTPUT
          else
            echo "  HIÁNYZIK uj_palyak.json  (csak az --only-new / --new módhoz kell)"
          fi

      - name: Ellenőrzés futtatása
        id: futtat
        continue-on-error: true
        env:
          APPJS_PATH: ${{ steps.fajlok.outputs.appjs }}
          UJ_PALYAK_PATH: ${{ steps.fajlok.outputs.ujpalyak }}
        run: |
          node ${{ steps.fajlok.outputs.script }} ${{ github.event.inputs.orszagok }} || true
          echo "--- Eredmény ---"
          if [ -f eredmeny/osszefoglalo.txt ]; then
            cat eredmeny/osszefoglalo.txt
          fi

      - name: Eredmények megőrzése letölthető csomagként
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ellenorzes-${{ github.run_number }}
          path: eredmeny/
          retention-days: 90

      - name: Súlyos eltérések kigyűjtése
        id: sulyos
        if: always()
        run: |
          if [ ! -f eredmeny/elteresek.csv ]; then
            echo "van_elteres=nem" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Csak a SÚLYOS sorokat nézzük – ezek igényelnek beavatkozást.
          # FIGYELEM: a grep -c nulla találatnál kiírja a "0"-t, DE hibakóddal lép ki.
          # Ezért "|| true" kell, NEM "|| echo 0" – az utóbbi "0\n0"-t adna,
          # amit a [ -gt ] már nem tud számként értelmezni.
          SULYOS=$(grep -c 'SÚLYOS ELTÉRÉS' eredmeny/elteresek.csv 2>/dev/null || true)
          SULYOS=${SULYOS:-0}
          echo "Súlyos eltérések száma: $SULYOS"
          echo "sulyos_db=$SULYOS" >> $GITHUB_OUTPUT
          if [ "$SULYOS" -gt 0 ]; then
            echo "van_elteres=igen" >> $GITHUB_OUTPUT
            {
              echo 'reszletek<<VEGE'
              head -1 eredmeny/elteresek.csv
              grep 'SÚLYOS ELTÉRÉS' eredmeny/elteresek.csv | head -40
              echo 'VEGE'
            } >> $GITHUB_OUTPUT
          else
            echo "van_elteres=nem" >> $GITHUB_OUTPUT
          fi

      - name: Issue nyitása, ha van súlyos eltérés
        if: steps.sulyos.outputs.van_elteres == 'igen'
        uses: actions/github-script@v7
        with:
          script: |
            const db = '${{ steps.sulyos.outputs.sulyos_db }}';
            const reszletek = `${{ steps.sulyos.outputs.reszletek }}`;
            const datum = new Date().toLocaleDateString('hu-HU');

            const body = [
              `## Havi adatellenőrzés – ${datum}`,
              ``,
              `Az automatikus ellenőrzés **${db} súlyos eltérést** talált.`,
              ``,
              `### Mit jelent a "súlyos"`,
              `- **Nem létező domain** – a cím kitalált vagy megszűnt`,
              `- **Wikidata szerint megszűnt, nálunk aktív** – a térképen félrevezető`,
              `- **25 km-nél nagyobb koordináta-eltérés** – rossz helyen a pálya`,
              ``,
              `### Találatok`,
              ``,
              '```csv',
              reszletek,
              '```',
              ``,
              `### Teljes eredmény`,
              `A részletes CSV a futás **Artifacts** szekciójában tölthető le:`,
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `---`,
              `> Ez az Issue automatikusan jött létre. A szkript **nem módosította az app.js-t** –`,
              `> minden változtatás emberi döntés. Ellenőrizd a találatokat, mielőtt javítasz.`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Adatellenőrzés: ${db} súlyos eltérés (${datum})`,
              body,
              labels: ['adatellenőrzés', 'automatikus'],
            });

      - name: Összegzés a futás oldalán
        if: always()
        run: |
          {
            echo "## Havi adatellenőrzés lefutott"
            echo ""
            if [ -f eredmeny/osszefoglalo.txt ]; then
              echo '```'
              cat eredmeny/osszefoglalo.txt
              echo '```'
            else
              echo "Nem készült összefoglaló – nézd meg a futás naplóját."
            fi
          } >> $GITHUB_STEP_SUMMARY
