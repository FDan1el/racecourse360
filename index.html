<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racecourse360 - Global Horse Racing Map</title>
    
    <!-- 3D Globe & 2D Leaflet könyvtárak -->
    <script src="https://unpkg.com/globe.gl"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030712; }

        /* Fejléc */
        header {
            position: absolute; top: 0; left: 0; right: 0; height: 65px;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            color: white; display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .logo { font-size: 1.5rem; font-weight: 800; color: #ffffff; cursor: pointer; user-select: none; }
        .logo span { color: #f59e0b; }

        /* Keresőmező a fejlécben */
        .search-container { position: relative; width: 280px; }
        .search-input {
            width: 100%; padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4); color: white; font-size: 0.85rem; outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: #38bdf8; }
        .search-results {
            position: absolute; top: 42px; left: 0; right: 0; background: #0f172a;
            border: 1px solid #334155; border-radius: 8px; max-height: 200px; overflow-y: auto;
            display: none; z-index: 1001; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
        }
        .search-item {
            padding: 10px; color: #e2e8f0; font-size: 0.85rem; cursor: pointer;
            border-bottom: 1px solid #1e293b; transition: background 0.2s;
        }
        .search-item:hover { background: #1e293b; color: #38bdf8; }

        /* Szakág Szűrők */
        .filter-container { display: flex; gap: 6px; }
        .filter-btn {
            background: none; border: 1px solid rgba(255,255,255,0.15); color: #94a3b8;
            padding: 6px 14px; font-size: 0.8rem; font-weight: 600; border-radius: 20px; cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

        /* Vissza gomb a 2D térképhez */
        .back-btn {
            position: absolute; top: 80px; left: 20px; z-index: 900;
            background: #0f172a; color: white; border: 1px solid #334155;
            padding: 10px 18px; border-radius: 20px; font-weight: 600; font-size: 0.85rem;
            cursor: pointer; display: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        .back-btn:hover { background: #1e293b; color: #38bdf8; }

        /* Nézetek Konténerei */
        #globeViz { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #map2d { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 2; opacity: 0; pointer-events: none; transition: opacity 0.8s ease; }

        /* Felugró Modal Ablak */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            z-index: 2000; padding: 15px;
        }
        .modal-card {
            background: #ffffff; width: 100%; max-width: 480px; max-height: 90vh;
            display: flex; flex-direction: column; border-radius: 16px; overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); position: relative;
            animation: popup 0.25s ease-out;
        }

        @keyframes popup {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header-img { width: 100%; height: 150px; background-size: cover; background-position: center; position: relative; flex-shrink: 0; }
        .close-btn {
            position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6);
            color: white; border: none; width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; font-size: 1.1rem; z-index: 10; display: flex; align-items: center; justify-content: center;
        }
        .tab-nav { display: flex; background: #0f172a; border-bottom: 1px solid #334155; flex-shrink: 0; }
        .tab-btn {
            flex: 1; padding: 12px; background: none; border: none; color: #94a3b8;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: center;
            border-bottom: 3px solid transparent; transition: all 0.2s;
        }
        .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .modal-body { padding: 20px; overflow-y: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .info-item span { display: block; font-size: 0.75rem; color: #64748b; text-transform: uppercase; }
        .info-item strong { font-size: 0.9rem; color: #1e293b; }
        .btn-official { display: block; width: 100%; text-align: center; background: #f1f5f9; color: #0f172a; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.85rem; border: 1px solid #cbd5e1; margin-bottom: 10px; transition: background 0.2s; }
        .btn-official:hover { background: #e2e8f0; }
        .btn-booking { display: block; width: 100%; text-align: center; background: #003580; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 15px; transition: background 0.2s; }
        .btn-booking:hover { background: #00224f; }
        .ad-container { background: #f1f5f9; border: 1px dashed #cbd5e1; padding: 12px; text-align: center; border-radius: 8px; font-size: 0.75rem; color: #94a3b8; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="resetToGlobe()">Racecourse<span>360</span></div>

        <!-- Keresőmező -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Keresés pályára vagy városra..." oninput="handleSearch()">
            <div id="searchResults" class="search-results"></div>
        </div>

        <!-- Szakág Szűrők -->
        <div class="filter-container">
            <button class="filter-btn active" onclick="setFilter('all', this)">Összes</button>
            <button class="filter-btn" onclick="setFilter('gallop', this)">🐎 Galopp</button>
            <button class="filter-btn" onclick="setFilter('trot', this)">🚜 Ügető</button>
        </div>
    </header>

    <!-- Vissza a Földgömbre gomb -->
    <button id="backBtn" class="back-btn" onclick="resetToGlobe()">🌍 Vissza a Földgömbre</button>

    <!-- 3D Globe & 2D Map elemek -->
    <div id="globeViz"></div>
    <div id="map2d"></div>

    <!-- Felugró Modal Ablak -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header-img" id="modalImg">
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            
            <div class="tab-nav">
                <button class="tab-btn active" onclick="switchTab('overview')">ℹ️ Áttekintés</button>
                <button class="tab-btn" onclick="switchTab('history')">📜 Történelem</button>
            </div>

            <div class="modal-body">
                <!-- 1. Áttekintés fül -->
                <div id="tab-overview" class="tab-content active">
                    <h2 style="font-size: 1.4rem; color: #0f172a; margin-bottom: 2px;" id="modalTitle">-</h2>
                    <div style="color: #64748b; font-size: 0.85rem; margin-bottom: 15px;" id="modalLocation">-</div>
                    
                    <div class="info-grid">
                        <div class="info-item"><span>Szakág</span><strong id="modalType">-</strong></div>
                        <div class="info-item"><span>Talaj</span><strong id="modalSurface">-</strong></div>
                        <div class="info-item"><span>Pályahossz</span><strong id="modalLength">-</strong></div>
                        <div class="info-item"><span>Alapítva</span><strong id="modalBuilt">-</strong></div>
                    </div>

                    <a href="#" id="modalWebsiteBtn" target="_blank" class="btn-official">🌐 Hivatalos weboldal felkeresése</a>
                    <a href="#" id="modalBookingBtn" target="_blank" class="btn-booking">🏨 Szállások a pálya közelében (Booking.com)</a>
                    
                    <div class="ad-container">[ AdSense Reklámbanner helye ]</div>
                </div>

                <!-- 2. Történelem fül -->
                <div id="tab-history" class="tab-content">
                    <h3 style="margin-bottom: 10px; color: #0f172a;">A pálya története</h3>
                    <p style="color: #334155; font-size: 0.9rem; line-height: 1.6;" id="modalHistory">-</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. ADATBÁZIS (Itt bővíthető a listád a jövőben) ---
        const activeCountries = {
            "GBR": { name: "United Kingdom", lat: 54.0, lng: -2.0, zoom: 6 },
            "FRA": { name: "France", lat: 46.6, lng: 2.2, zoom: 6 },
            "HUN": { name: "Hungary", lat: 47.1, lng: 19.5, zoom: 8 }
        };

        const racecourses = [
            {
                id: "ascot", countryISO: "GBR", name: "Ascot Racecourse", location: "Ascot, Egyesült Királyság",
                lat: 51.4103, lng: -0.6766, type: "Galopp", surface: "Fű (Turf)", length: "2800 m", built: "1711",
                website: "https://www.ascot.com", img: "https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=500",
                history: "Az Ascot versenypályát Anna királynő alapította 1711-ben. A mai napig szoros kapcsolatot ápol a brit királyi családdal, a Royal Ascot a világ egyik legrangosabb társasági és sporteseménye."
            },
            {
                id: "kincsem", countryISO: "HUN", name: "Kincsem Park", location: "Budapest, Magyarország",
                lat: 47.4965, lng: 19.1227, type: "Galopp & Ügető", surface: "Fű & Homok", length: "1200 m", built: "1925",
                website: "https://kincsempark.hu", img: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500",
                history: "Magyarország egyetlen aktív lóversenypályája. Névadója a legyőzhetetlen csodakanca, Kincsem, aki 54 versenyéből 54-et megnyert."
            },
            {
                id: "longchamp", countryISO: "FRA", name: "Hippodrome de ParisLongchamp", location: "Párizs, Franciaország",
                lat: 48.8575, lng: 2.2333, type: "Galopp", surface: "Fű (Turf)", length: "2750 m", built: "1857",
                website: "https://www.france-galop.com", img: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500",
                history: "A híres Prix de l'Arc de Triomphe otthona Párizs szívében. A világ egyik legmodernebb lelátójával rendelkező történelmi galopp-pálya."
            }
        ];

        let currentFilter = 'all';
        let map2dInstance = null;
        let markers2d = [];

        // --- 2. 3D GLOBE INICIALIZÁLÁSA ---
        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
            .polygonSideColor(() => 'rgba(15, 23, 42, 0.5)')
            .polygonStrokeColor(() => '#1e293b')
            .polygonCapColor(feat => {
                const country = activeCountries[feat.properties.ISO_A3];
                return country ? 'rgba(245, 158, 11, 0.45)' : 'rgba(30, 41, 59, 0.2)';
            })
            .onPolygonClick(polygon => {
                const iso = polygon.properties.ISO_A3;
                const country = activeCountries[iso];
                if (country) transitionTo2D(country.lat, country.lng, country.zoom);
            });

        // Országhatárok betöltése
        fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
            .then(res => res.json()).then(countries => world.polygonsData(countries.features));

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        // --- 3. KAMERA ÁTMENET LOGIKA (3D ➡️ 2D) ---
        function transitionTo2D(lat, lng, zoom) {
            world.controls().autoRotate = false;
            world.pointOfView({ lat: lat, lng: lng, altitude: 0.6 }, 1400);

            setTimeout(() => {
                const mapEl = document.getElementById('map2d');
                mapEl.style.pointerEvents = 'auto';
                mapEl.style.opacity = '1';
                document.getElementById('backBtn').style.display = 'block';

                if (!map2dInstance) {
                    init2DMap(lat, lng, zoom);
                } else {
                    map2dInstance.setView([lat, lng], zoom);
                }
            }, 1200);
        }

        // 2D Leaflet Esri Műholdas Térkép
        function init2DMap(lat, lng, zoom) {
            map2dInstance = L.map('map2d').setView([lat, lng], zoom);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Esri'
            }).addTo(map2dInstance);

            renderMarkers();
        }

        function renderMarkers() {
            markers2d.forEach(m => map2dInstance.removeLayer(m));
            markers2d = [];

            racecourses.forEach(track => {
                if (currentFilter === 'gallop' && !track.type.includes('Galopp')) return;
                if (currentFilter === 'trot' && !track.type.includes('Ügető')) return;

                const marker = L.marker([track.lat, track.lng]).addTo(map2dInstance);
                marker.on('click', () => openModal(track));
                markers2d.push(marker);
            });
        }

        // Visszaállás a 3D Földgömbre
        function resetToGlobe() {
            const mapEl = document.getElementById('map2d');
            mapEl.style.opacity = '0';
            mapEl.style.pointerEvents = 'none';
            document.getElementById('backBtn').style.display = 'none';
            world.controls().autoRotate = true;
            world.pointOfView({ lat: 20, lng: 0, altitude: 2.5 }, 1000);
        }

        // --- 4. KERESŐ LOGIKA ---
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';

            if (query.length < 2) { resultsContainer.style.display = 'none'; return; }

            const filtered = racecourses.filter(t => t.name.toLowerCase().includes(query) || t.location.toLowerCase().includes(query));

            if (filtered.length > 0) {
                resultsContainer.style.display = 'block';
                filtered.forEach(track => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.innerHTML = `<strong>${track.name}</strong> <br/><small style="color:#94a3b8">${track.location}</small>`;
                    div.onclick = () => {
                        resultsContainer.style.display = 'none';
                        document.getElementById('searchInput').value = '';
                        transitionTo2D(track.lat, track.lng, 13);
                        setTimeout(() => openModal(track), 1600);
                    };
                    resultsContainer.appendChild(div);
                });
            } else {
                resultsContainer.style.display = 'none';
            }
        }

        // --- 5. MODAL ÉS FÜLEK LOGIKA ---
        function openModal(track) {
            document.getElementById('modalTitle').innerText = track.name;
            document.getElementById('modalLocation').innerText = track.location;
            document.getElementById('modalType').innerText = track.type;
            document.getElementById('modalSurface').innerText = track.surface;
            document.getElementById('modalLength').innerText = track.length;
            document.getElementById('modalBuilt').innerText = track.built;
            document.getElementById('modalImg').style.backgroundImage = `url('${track.img}')`;
            document.getElementById('modalHistory').innerText = track.history;
            document.getElementById('modalWebsiteBtn').href = track.website;
            document.getElementById('modalBookingBtn').href = `https://www.booking.com/searchresults.hu.html?latitude=${track.lat}&longitude=${track.lng}&aid=YOUR_AFFILIATE_ID`;

            switchTab('overview');
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            const idx = ['overview', 'history'].indexOf(tabName);
            document.querySelectorAll('.tab-btn')[idx].classList.add('active');
        }

        function setFilter(type, btn) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (map2dInstance) renderMarkers();
        }

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') closeModal();
        });
    </script>
</body>
</html>
