<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racecourse360 - Global Horse Racing Map</title>

    <!-- Globe.gl 3D könyvtár -->
    <script src="https://unpkg.com/globe.gl"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030712; }

        /* Fejléc */
        header {
            position: absolute; top: 0; left: 0; right: 0; height: 65px;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px);
            color: white; display: flex; align-items: center; justify-content: space-between;
            padding: 0 25px; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; color: #ffffff; }
        .logo span { color: #f59e0b; }

        /* Szakág Szűrő Gombok */
        .filter-container {
            display: flex; gap: 8px; background: rgba(0, 0, 0, 0.4);
            padding: 4px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
        }
        .filter-btn {
            background: none; border: none; color: #94a3b8; padding: 8px 16px;
            font-size: 0.85rem; font-weight: 600; border-radius: 20px; cursor: pointer;
            transition: all 0.3s ease;
        }
        .filter-btn.active { background: #38bdf8; color: #0f172a; }
        .filter-btn:hover:not(.active) { color: #ffffff; }

        /* Vissza a földgömbhöz gomb (csak ország-nézetben látszik) */
        .back-btn {
            display: none;
            background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; color: #f59e0b;
            padding: 8px 18px; font-size: 0.85rem; font-weight: 600; border-radius: 20px;
            cursor: pointer; transition: all 0.2s ease;
        }
        .back-btn:hover { background: #f59e0b; color: #0f172a; }
        .back-btn.visible { display: inline-block; }

        /* Utasítási infósáv alul */
        .instruction-bar {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            color: #e2e8f0; padding: 12px 24px; border-radius: 30px; font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.1); z-index: 100; pointer-events: none;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 90%; text-align: center;
        }

        /* Ország-panel: pálya lista jobb oldalt, amikor egy ország aktív */
        .country-panel {
            position: absolute; top: 85px; right: 20px; width: 320px; max-height: calc(100vh - 140px);
            overflow-y: auto; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 18px;
            color: #e2e8f0; z-index: 100; display: none;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
        }
        .country-panel.visible { display: block; }
        .country-panel h2 { font-size: 1.1rem; color: #f59e0b; margin-bottom: 4px; }
        .country-panel .sub { font-size: 0.75rem; color: #64748b; margin-bottom: 14px; }
        .track-item {
            padding: 10px 12px; border-radius: 10px; margin-bottom: 8px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            cursor: pointer; transition: background 0.2s ease;
        }
        .track-item:hover { background: rgba(56, 189, 248, 0.12); border-color: #38bdf8; }
        .track-item .t-name { font-weight: 700; font-size: 0.9rem; color: #ffffff; }
        .track-item .t-meta { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }
        .track-item .t-note { font-size: 0.78rem; color: #cbd5e1; margin-top: 4px; line-height: 1.3; }

        /* Egyszerű scrollbar stílus a panelhez */
        .country-panel::-webkit-scrollbar { width: 6px; }
        .country-panel::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        /* 3D Földgömb Konténer */
        #globeViz { width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Racecourse<span>360</span></div>

        <!-- Szakág Szűrő -->
        <div class="filter-container">
            <button class="filter-btn active" onclick="setFilter('all', this)">Összes</button>
            <button class="filter-btn" onclick="setFilter('gallop', this)">🐎 Galopp</button>
            <button class="filter-btn" onclick="setFilter('trot', this)">🚜 Ügető</button>
        </div>

        <button class="back-btn" id="backBtn" onclick="resetToGlobe()">← Vissza a földgömbhöz</button>
    </header>

    <!-- Földgömb megjelenítő -->
    <div id="globeViz"></div>

    <!-- Ország-panel: a kiválasztott ország pályáinak listája -->
    <div class="country-panel" id="countryPanel">
        <h2 id="panelTitle"></h2>
        <div class="sub" id="panelSub"></div>
        <div id="panelTracks"></div>
    </div>

    <div class="instruction-bar" id="instructionBar">
        💡 Válassz egy színezett országot a versenypályák megtekintéséhez!
    </div>

    <script>
        // ============================================================
        // PÁLYA-ADATBÁZIS
        // Forrás: saját, több nyilvános forrásból kereszthivatkozott
        // gyűjtés (Svensk Travsport, LeTrot, Wikipédia, hivatalos
        // pálya-honlapok). Csak közismert tényeket tartalmaz.
        // ============================================================
        const trackDatabase = {
            SWE: [
                { name: "Jägersro", city: "Malmö", lat: 55.5699, lng: 13.0697, founded: 1907, note: "Svédország legrégebbi pályája; egyetlen kombinált ügető-galopp aréna" },
                { name: "Solvalla", city: "Stockholm", lat: 59.3666, lng: 17.9397, founded: 1927, note: "Skandinávia legnagyobb pályája; az Elitloppet otthona" },
                { name: "Åbytravet", city: "Mölndal", lat: 57.6500, lng: 12.0017, founded: 1936, note: "Svédország 2. legnagyobb pályája" },
                { name: "Färjestad", city: "Karlstad", lat: 59.4085, lng: 13.5006, founded: 1936, note: "Unionstravet – közös svéd-norvég futam" },
                { name: "Bergsåkers travbana", city: "Sundsvall", lat: 62.4151, lng: 17.2269, founded: 1932, note: "Svédország 3. legrégebbi pályája" },
                { name: "Axevalla travbana", city: "Axvall", lat: 58.4006, lng: 13.5642, founded: 1956, note: "Az ország leghosszabb célegyenese" },
                { name: "Sundbyholms travbana", city: "Eskilstuna", lat: 59.4388, lng: 16.6138, founded: 1955, note: "A Breeders' Crown döntőinek helyszíne 2008 óta" },
                { name: "Bodentravet", city: "Boden", lat: 65.8133, lng: 21.7057, founded: 1944, note: "Svédország legészakibb travbanája" },
                { name: "Gävletravet", city: "Gävle", lat: 60.6885, lng: 17.1384, founded: 1938, note: "\"Sveriges snabbaste bana\" – az ország leggyorsabb pályája" },
                { name: "Hagmyren", city: "Hudiksvall", lat: 61.7729, lng: 17.1145, founded: 1956, note: "A legendás Nordin fivérek szülőföldje" },
                { name: "Halmstadtravet", city: "Halmstad", lat: 56.6905, lng: 12.9277, founded: 1969, note: "Sprintermästaren futam helyszíne" },
                { name: "Hotingtravet", city: "Hoting", lat: 64.0875, lng: 16.2358, founded: 1967, note: "Évi mindössze 3 versenynap" },
                { name: "Kalmartravet", city: "Kalmar", lat: 56.6680, lng: 16.2717, founded: 1965, note: "Sibylla svéd hercegnő nyitotta meg" },
                { name: "Karlshamnstravet", city: "Asarum", lat: 56.2228, lng: 14.8313, founded: 1993, note: "A nézők a pálya belső terében állnak" },
                { name: "Fornaboda travbana", city: "Lindesberg", lat: 59.6295, lng: 15.1741, founded: 1951, note: "Korábban a befagyott Lindessjön tavon versenyeztek" },
                { name: "Lyckseletravet", city: "Lycksele", lat: 64.5521, lng: 18.7160, founded: 1955, note: "Nyári lóhét a helyi közösségi élet csúcspontja" },
                { name: "Mantorp Hästsportarena", city: "Mantorp", lat: 58.3695, lng: 15.2837, founded: 1965, note: "A legendás Ina Scot nevű ló itt van eltemetve" },
                { name: "Ovallatravet", city: "Oviken", lat: 62.9978, lng: 14.3773, founded: 1971, note: "800 m-es kispálya" },
                { name: "Romme travbana", city: "Borlänge", lat: 60.4529, lng: 15.5005, founded: 1955, note: "Rommeheatet – melegvérűek futama" },
                { name: "Rättviks travbana", city: "Rättvik", lat: 60.9021, lng: 15.1156, founded: 1955, note: "Itt indult Olle Goop, Svédország legsikeresebb hajtójának pályafutása" },
                { name: "Skellefteåtravet", city: "Skellefteå", lat: 64.7325, lng: 20.9492, founded: 1952, note: "Az egyik két svéd pálya \"open stretch\" előzősávval" },
                { name: "Solänget", city: "Örnsköldsvik", lat: 63.2861, lng: 18.6352, founded: 1952, note: "Mellanbana kategóriájú pálya" },
                { name: "Tingsrydtravet", city: "Tingsryd", lat: 56.5118, lng: 14.9960, founded: 2003, note: "Svédország egyetlen \"mile\" (1609 m) pályája" },
                { name: "Umåkers travbana", city: "Umeå", lat: 63.8209, lng: 20.1779, founded: 1944, note: "Egész évben rendeznek itt versenyt" },
                { name: "Vaggerydstravet", city: "Vaggeryd", lat: 57.5226, lng: 14.1117, founded: 1995, note: "SmålandsMästaren futam helyszíne" },
                { name: "Visbytravet", city: "Gotland", lat: 57.6175, lng: 18.3288, founded: 1948, note: "Szigeti pálya, csak nyáron üzemel" },
                { name: "Åmålstravet", city: "Åmål", lat: 59.0335, lng: 12.7051, founded: 1953, note: "Az egyetlen pálya, ahol jobbkéz irányban versenyeznek" },
                { name: "Årjängstravet", city: "Årjäng", lat: 59.3900, lng: 12.1557, founded: 1936, note: "Sokak szerint Svédország legszebb ügetőpályája" },
                { name: "Örebrotravet", city: "Örebro", lat: 59.2191, lng: 15.1611, founded: 1954, note: "Örebro Int'l – 3140 m-es stayer-futam" },
                { name: "Östersundstravet", city: "Östersund", lat: 63.1643, lng: 14.6730, founded: 1936, note: "Az ország 2. leghosszabb célegyenese" },
                { name: "Bollnästravet", city: "Bollnäs", lat: 61.3403, lng: 16.3356, founded: 1955, note: "Hälsingland régió egyik pályája" },
                { name: "Dannero travbana", city: "Kramfors", lat: 63.0207, lng: 17.8045, founded: 1958, note: "2005-ös tűz után teljesen megújult" },
                { name: "Arvika travbana", city: "Arvika", lat: 59.6574, lng: 12.6221, founded: 1954, note: "A Wermlands Trafvarsällskap (1882) Svédország legrégebbi ügető-egyesülete" }
            ],
            FRA: [
                { name: "Hippodrome de Vincennes", city: "Párizs", lat: 48.8212, lng: 2.4517, founded: 1863, note: "A trot \"temploma\" – itt rendezik a Prix d'Amérique-et" },
                { name: "Hippodrome d'Enghien-Soisy", city: "Soisy-sous-Montmorency", lat: 48.9805, lng: 2.2917, founded: 1879, note: "Franciaország 2. legnagyobb ügetőpályája" },
                { name: "Hippodrome de Rambouillet", city: "Rambouillet", lat: 48.6366, lng: 1.8508, founded: 1880, note: "Családias, erdőszéli pálya" },
                { name: "Hippodrome de Caen (la Prairie)", city: "Caen", lat: 49.1748, lng: -0.3641, founded: 1839, note: "Az egyik legelső kizárólag ügető célú francia pálya" },
                { name: "Hippodrome de Cabourg", city: "Cabourg", lat: 49.2801, lng: -0.1211, founded: 1928, note: "\"A normandiai kis Vincennes\"" },
                { name: "Hippodrome de Bellevue-la-Forêt", city: "Laval", lat: 48.0384, lng: -0.7953, founded: 1921, note: "Nyugat-franciaországi regionális referenciapálya" },
                { name: "Hippodrome de Nantes", city: "Nantes", lat: 47.2457, lng: -1.5626, founded: 1875, note: "A Grand National du Trot egyik állomása" },
                { name: "Hippodrome de Châteaubriant", city: "Châteaubriant", lat: 47.7376, lng: -1.3922, founded: 1980, note: "Első kategóriás, mindhárom diszciplínát befogadó pólus" },
                { name: "Hippodrome de Pontchâteau", city: "Pontchâteau", lat: 47.4459, lng: -2.1315, founded: 1889, note: "Vincennes fontos \"előszoba\" pályája" },
                { name: "Hippodrome d'Angers-Écouflant", city: "Écouflant", lat: 47.4978, lng: -0.5078, founded: 1847, note: "\"Equures\" lójólléti minősítés (2024)" },
                { name: "Hippodrome de la Côte d'Azur", city: "Cagnes-sur-Mer", lat: 43.6485, lng: 7.1462, founded: 1952, note: "A francia téli lóversenyzés egyik központja" },
                { name: "Hippodrome de Vichy-Bellerive", city: "Bellerive-sur-Allier", lat: 46.1305, lng: 3.4072, founded: 1875, note: "Az Allier folyó partján, márciustól szeptemberig" },
                { name: "Hippodrome de Divonne-les-Bains", city: "Divonne-les-Bains", lat: 46.3503, lng: 6.1563, founded: 1965, note: "Az egyetlen francia pálya a Genfi-tó medencéjében" },
                { name: "Hippodrome d'Agen-La Garenne", city: "Agen", lat: 44.1762, lng: 0.5978, founded: 1850, note: "1975-ben itt rendezték az első kizárólag nőknek szóló futamot" }
            ]
        };

        // Minta országlista, ahol van aktív lóversenyzés (Szakágakkal)
        const activeCountries = {
            "GBR": { name: "United Kingdom", hasGallop: true, hasTrot: true, tracks: 59 },
            "FRA": { name: "France", hasGallop: true, hasTrot: true, tracks: 230 },
            "HUN": { name: "Hungary", hasGallop: true, hasTrot: true, tracks: 1 },
            "JPN": { name: "Japan", hasGallop: true, hasTrot: false, tracks: 25 },
            "USA": { name: "United States", hasGallop: true, hasTrot: true, tracks: 100 },
            "AUS": { name: "Australia", hasGallop: true, hasTrot: true, tracks: 300 },
            "SWE": { name: "Sweden", hasGallop: false, hasTrot: true, tracks: 33 },
            "DEU": { name: "Germany", hasGallop: true, hasTrot: true, tracks: 40 },
            "IRL": { name: "Ireland", hasGallop: true, hasTrot: false, tracks: 26 }
        };

        let currentFilter = 'all';
        let currentIso = null; // melyik ország van most kiválasztva

        // Globe.gl inicializálása
        const world = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
            .lineHoverPrecision(0)
            .polygonSideColor(() => 'rgba(15, 23, 42, 0.5)')
            .polygonStrokeColor(() => '#1e293b')
            .polygonCapColor(feat => polygonColor(feat, null))
            .polygonLabel(({ properties: d }) => {
                const country = activeCountries[d.ISO_A3];
                if (!country) return null;
                return `
                    <div style="background: #0f172a; color: white; padding: 8px 12px; border-radius: 8px; border: 1px solid #334155; font-family: sans-serif;">
                        <strong>${country.name}</strong><br/>
                        <span style="color: #f59e0b; font-size: 0.85rem;">🏁 ${country.tracks} aktív versenypálya</span>
                    </div>
                `;
            })
            .onPolygonHover(hoverD => world
                .polygonAltitude(d => d === hoverD ? 0.06 : 0.01)
                .polygonCapColor(d => polygonColor(d, hoverD))
            )
            .onPolygonClick(polygon => {
                const iso = polygon.properties.ISO_A3;
                const country = activeCountries[iso];
                if (!country) return;

                currentIso = iso;

                const bbox = polygon.bbox;
                const lat = (bbox[1] + bbox[3]) / 2;
                const lng = (bbox[0] + bbox[2]) / 2;

                world.pointOfView({ lat: lat, lng: lng, altitude: 0.8 }, 1800);

                setTimeout(() => showCountryDetail(iso, country), 1800);
            });

        function polygonColor(feat, hoverD) {
            const iso = feat.properties.ISO_A3;
            const country = activeCountries[iso];
            if (!country) return 'rgba(30, 41, 59, 0.2)';

            if (feat === hoverD) return '#f59e0b';

            if (currentFilter === 'gallop' && country.hasGallop) return 'rgba(16, 185, 129, 0.45)';
            if (currentFilter === 'trot' && country.hasTrot) return 'rgba(56, 189, 248, 0.45)';
            return 'rgba(245, 158, 11, 0.45)';
        }

        // Országhatárok (GeoJSON) betöltése
        fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(countries => {
                world.polygonsData(countries.features);
            });

        // Automatikus lassú forgás beállítása
        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        // Szűrő váltása
        function setFilter(type, btn) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            world.polygonsData(world.polygonsData());
        }

        // ============================================================
        // Ország-részletnézet: pontok kirajzolása a földgömbön +
        // a jobb oldali lista feltöltése
        // ============================================================
        function showCountryDetail(iso, country) {
            const tracks = trackDatabase[iso];

            document.getElementById('backBtn').classList.add('visible');
            document.getElementById('instructionBar').style.display = 'none';

            const panel = document.getElementById('countryPanel');
            const title = document.getElementById('panelTitle');
            const sub = document.getElementById('panelSub');
            const list = document.getElementById('panelTracks');

            title.textContent = country.name;

            if (!tracks || tracks.length === 0) {
                // Még nincs részletes adatunk ehhez az országhoz
                sub.textContent = `${country.tracks} aktív versenypálya – részletes adatgyűjtés folyamatban`;
                list.innerHTML = `<div class="track-item" style="cursor:default;">
                    <div class="t-note">Ehhez az országhoz még nincs egyedi pálya-adatunk feltöltve. Folytatjuk a gyűjtést!</div>
                </div>`;
                world.pointsData([]);
                panel.classList.add('visible');
                return;
            }

            sub.textContent = `${tracks.length} dokumentált versenypálya`;

            // Jobb oldali lista feltöltése
            list.innerHTML = tracks.map((t, idx) => `
                <div class="track-item" onclick="focusTrack(${idx}, '${iso}')">
                    <div class="t-name">${t.name}</div>
                    <div class="t-meta">${t.city} · alapítva ${t.founded}</div>
                    <div class="t-note">${t.note}</div>
                </div>
            `).join('');

            panel.classList.add('visible');

            // Pontok kirajzolása a földgömbön
            world
                .pointsData(tracks)
                .pointLat('lat')
                .pointLng('lng')
                .pointColor(() => '#38bdf8')
                .pointAltitude(0.01)
                .pointRadius(0.35)
                .pointLabel(t => `
                    <div style="background:#0f172a; color:white; padding:8px 12px; border-radius:8px; border:1px solid #334155; max-width:220px;">
                        <strong>${t.name}</strong><br/>
                        <span style="color:#94a3b8; font-size:0.8rem;">${t.city} · ${t.founded}</span><br/>
                        <span style="font-size:0.78rem;">${t.note}</span>
                    </div>
                `)
                .onPointClick(t => {
                    world.pointOfView({ lat: t.lat, lng: t.lng, altitude: 0.3 }, 1200);
                });
        }

        // Egy adott pályára zoomol a jobb oldali listából kattintva
        function focusTrack(idx, iso) {
            const t = trackDatabase[iso][idx];
            world.pointOfView({ lat: t.lat, lng: t.lng, altitude: 0.3 }, 1200);
        }

        // Vissza a teljes földgömb-nézethez
        function resetToGlobe() {
            currentIso = null;
            document.getElementById('backBtn').classList.remove('visible');
            document.getElementById('countryPanel').classList.remove('visible');
            document.getElementById('instructionBar').style.display = 'block';
            world.pointsData([]);
            world.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 1800);
        }
    </script>
</body>
</html>
