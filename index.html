<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Racecourse360 - Global Horse Racing Map</title>

<!-- Globe.gl 3D könyvtár -->
<script src="https://unpkg.com/globe.gl"></script>

<!-- Leaflet 2D térkép könyvtár -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030712; }

    /* ============ FEJLÉC ============ */
    header {
        position: absolute; top: 0; left: 0; right: 0; height: 65px;
        background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px);
        color: white; display: flex; align-items: center; justify-content: space-between;
        padding: 0 25px; z-index: 500; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; color: #ffffff; }
    .logo span { color: #f59e0b; }

    .filter-container {
        display: flex; gap: 8px; background: rgba(0, 0, 0, 0.4);
        padding: 4px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
    }
    .filter-btn {
        background: none; border: none; color: #94a3b8; padding: 8px 16px;
        font-size: 0.85rem; font-weight: 600; border-radius: 20px; cursor: pointer;
        transition: all 0.3s ease;
    }
    .filter-btn.active { background: #38bdf8; color: #0f172a; }
    .filter-btn:hover:not(.active) { color: #ffffff; }
    .filter-container.disabled { opacity: 0.35; pointer-events: none; }

    .back-btn {
        display: none;
        background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; color: #f59e0b;
        padding: 8px 18px; font-size: 0.85rem; font-weight: 600; border-radius: 20px;
        cursor: pointer; transition: all 0.2s ease;
    }
    .back-btn:hover { background: #f59e0b; color: #0f172a; }
    .back-btn.visible { display: inline-block; }

    /* ============ ALSÓ INFÓSÁV ============ */
    .instruction-bar {
        position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
        color: #e2e8f0; padding: 12px 24px; border-radius: 30px; font-size: 0.9rem;
        border: 1px solid rgba(255,255,255,0.1); z-index: 400; pointer-events: none;
        max-width: 90%; text-align: center;
        transition: opacity 0.3s ease;
    }

    /* ============ 3D FÖLDGÖMB RÉTEG ============ */
    #globeLayer {
        position: absolute; inset: 0; z-index: 10;
        opacity: 1; transition: opacity 0.6s ease;
    }
    #globeLayer.hidden { opacity: 0; pointer-events: none; }
    #globeViz { width: 100%; height: 100vh; }

    /* ============ 2D TÉRKÉP RÉTEG ============ */
    #mapLayer {
        position: absolute; inset: 0; z-index: 20;
        opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
    }
    #mapLayer.visible { opacity: 1; pointer-events: auto; }
    #mapViz { width: 100%; height: 100vh; background: #0f172a; }

    .layer-toggle {
        position: absolute; top: 85px; left: 20px; z-index: 450;
        background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 14px; padding: 4px; display: none; gap: 4px;
        backdrop-filter: blur(8px);
    }
    .layer-toggle.visible { display: flex; }
    .layer-toggle button {
        background: none; border: none; color: #94a3b8; padding: 7px 14px;
        font-size: 0.8rem; font-weight: 600; border-radius: 10px; cursor: pointer;
    }
    .layer-toggle button.active { background: #38bdf8; color: #0f172a; }

    /* ============ ORSZÁG-PANEL (pálya lista) ============ */
    .country-panel {
        position: absolute; top: 85px; right: 20px; width: 320px; max-height: calc(100vh - 140px);
        overflow-y: auto; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 18px;
        color: #e2e8f0; z-index: 450; display: none;
        box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
    }
    .country-panel.visible { display: block; }
    .country-panel h2 { font-size: 1.1rem; color: #f59e0b; margin-bottom: 4px; }
    .country-panel .sub { font-size: 0.75rem; color: #64748b; margin-bottom: 14px; }
    .track-item {
        padding: 10px 12px; border-radius: 10px; margin-bottom: 8px;
        background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
        cursor: pointer; transition: background 0.2s ease;
    }
    .track-item:hover { background: rgba(56, 189, 248, 0.12); border-color: #38bdf8; }
    .track-item .t-name { font-weight: 700; font-size: 0.9rem; color: #ffffff; }
    .track-item .t-meta { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }
    .track-item .t-note { font-size: 0.78rem; color: #cbd5e1; margin-top: 4px; line-height: 1.3; }
    .country-panel::-webkit-scrollbar { width: 6px; }
    .country-panel::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    .drag-handle { display: none; }

    /* ============ EGYEDI LEAFLET MARKER ============ */
    .track-marker {
        width: 16px; height: 16px; border-radius: 50%;
        background: #38bdf8; border: 2px solid #0f172a;
        box-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
    }

    /* ============ EGYEDI LEAFLET POPUP STÍLUS ============ */
    .leaflet-popup-content-wrapper {
        background: #0f172a; color: #e2e8f0; border-radius: 12px;
        border: 1px solid #334155; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.6);
    }
    .leaflet-popup-tip { background: #0f172a; }
    .popup-card { min-width: 220px; max-width: 260px; position: relative; }
    .popup-flag { position: absolute; top: 0; right: 0; font-size: 1.4rem; line-height: 1; }
    .popup-status {
        position: absolute; top: 2px; left: 0; width: 12px; height: 12px; border-radius: 50%;
        border: 2px solid #0f172a; cursor: help;
    }
    .popup-status.active { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.7); }
    .popup-status.inactive { background: #eab308; box-shadow: 0 0 6px rgba(234,179,8,0.7); }
    .popup-status.closed { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.7); }
    .popup-title { font-weight: 700; color: #ffffff; font-size: 0.95rem; margin-bottom: 8px; padding-right: 28px; padding-left: 18px; }
    .popup-tabs { display: flex; gap: 4px; margin-bottom: 8px; border-bottom: 1px solid #334155; }
    .popup-tab-btn {
        background: none; border: none; color: #64748b; font-size: 0.72rem; font-weight: 700;
        padding: 5px 8px; cursor: pointer; border-bottom: 2px solid transparent;
    }
    .popup-tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; }
    .popup-tab-content { display: none; font-size: 0.8rem; color: #cbd5e1; line-height: 1.4; }
    .popup-tab-content.active { display: block; }
    .popup-row { margin-bottom: 4px; }
    .popup-row b { color: #e2e8f0; }
    .popup-row a { color: #38bdf8; text-decoration: none; }
    .popup-row a:hover { text-decoration: underline; }

    /* ================================================================
       MOBIL OPTIMALIZÁCIÓ
       ================================================================ */
    @media (max-width: 768px) {
        header { height: 56px; padding: 0 10px; padding-top: env(safe-area-inset-top, 0); }
        .logo { font-size: 1.1rem; }
        .filter-container { gap: 2px; padding: 3px; }
        .filter-btn { padding: 8px 10px; font-size: 0.72rem; min-height: 40px; }
        .back-btn { padding: 8px 12px; font-size: 0.75rem; min-height: 40px; }
        .instruction-bar { bottom: 16px; font-size: 0.78rem; padding: 10px 16px; }

        .layer-toggle { top: auto; bottom: 168px; left: 50%; transform: translateX(-50%); right: auto; }
        .layer-toggle button { padding: 9px 16px; font-size: 0.78rem; min-height: 40px; }

        .country-panel {
            top: auto; left: 0; right: 0; bottom: 0; width: 100%;
            max-height: 42vh; border-radius: 20px 20px 0 0;
            padding: 10px 16px 16px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0));
            box-shadow: 0 -10px 30px -5px rgba(0,0,0,0.6);
        }
        .drag-handle {
            display: block; width: 40px; height: 4px; border-radius: 2px;
            background: #475569; margin: 0 auto 10px; cursor: pointer;
        }
        .country-panel h2 { font-size: 1rem; }
        .track-item { padding: 12px; min-height: 44px; }
        .country-panel.collapsed { max-height: 76px; overflow: hidden; }
        .country-panel.collapsed .sub,
        .country-panel.collapsed #panelTracks { display: none; }

        .leaflet-control-zoom a { width: 40px !important; height: 40px !important; line-height: 40px !important; font-size: 1.1rem !important; }
        .leaflet-popup-content { margin: 10px 14px; max-width: 260px; }
    }

    @media (max-width: 380px) {
        .logo { font-size: 0.95rem; }
        .filter-btn { padding: 7px 7px; font-size: 0.68rem; }
        .back-btn span.full-text { display: none; }
    }
</style>
</head>

<header>

const countryMeta = {
    SWE: { name: "Sweden", hasGallop: false, hasTrot: true, flag: "🇸🇪", orgSite: "https://www.travsport.se/", orgSiteLabel: "Svensk Travsport" },
    FRA: { name: "France", hasGallop: true,  hasTrot: true, flag: "🇫🇷", orgSite: "https://www.letrot.com/", orgSiteLabel: "LeTrot" },
    ITA: { name: "Italy",  hasGallop: true,  hasTrot: true, flag: "🇮🇹", orgSite: "https://www.politicheagricole.it/", orgSiteLabel: "Masaf – Direzione Generale Ippica" }
};

const DATA_ISO_CODES = Object.keys(trackDatabase); // ["SWE", "FRA"]

let currentFilter = 'all';
let currentIso = null;

// ================================================================
// 2) ORSZÁG-AZONOSÍTÁS JAVÍTVA
// A Natural Earth 110m GeoJSON-ban Franciaországnál (és néhány más
// országnál) az ISO_A3 mező hibásan "-99" lehet a helyes "FRA" helyett
// (ismert, dokumentált adathiba a tengerentúli megyék miatt). Ezért
// az ADM0_A3 mezőt is megnézzük tartalék azonosítóként.
// ================================================================
function resolveIso(properties) {
    if (properties.ISO_A3 && properties.ISO_A3 !== '-99') return properties.ISO_A3;
    if (properties.ADM0_A3 && properties.ADM0_A3 !== '-99') return properties.ADM0_A3;
    return properties.ISO_A3; // ha semmi nem jó, marad az eredeti (lehet "-99")
}

// ================================================================
// 3) 3D FÖLDGÖMB
// ================================================================
const world = Globe()
    (document.getElementById('globeViz'))
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .lineHoverPrecision(0)
    .polygonSideColor(() => 'rgba(15, 23, 42, 0.5)')
    .polygonStrokeColor(() => '#1e293b')
    .polygonCapColor(feat => polygonColor(feat, null))
    .polygonAltitude(0.01)
    .polygonLabel(({ properties }) => {
        const iso = resolveIso(properties);
        if (!DATA_ISO_CODES.includes(iso)) return null;
        const meta = countryMeta[iso];
        const count = trackDatabase[iso].length;
        return `
            <div style="background:#0f172a;color:white;padding:8px 12px;border-radius:8px;border:1px solid #334155;">
                <strong>${meta ? meta.name : iso}</strong><br/>
                <span style="color:#f59e0b;font-size:0.85rem;">🏁 ${count} dokumentált versenypálya</span>
            </div>
        `;
    })
    .onPolygonHover(hoverD => {
        world.polygonAltitude(d => {
            const iso = resolveIso(d.properties);
            if (!DATA_ISO_CODES.includes(iso)) return 0.01;
            return d === hoverD ? 0.06 : 0.01;
        });
        world.polygonCapColor(d => polygonColor(d, hoverD));
    })
    .onPolygonClick(polygon => {
        const iso = resolveIso(polygon.properties);
        if (!DATA_ISO_CODES.includes(iso)) return;
        goToCountry(iso);
    });

function polygonColor(feat, hoverD) {
    const iso = resolveIso(feat.properties);
    if (!DATA_ISO_CODES.includes(iso)) return 'rgba(30, 41, 59, 0.25)';

    if (feat === hoverD) return '#f59e0b';

    const meta = countryMeta[iso] || {};
    if (currentFilter === 'gallop') return meta.hasGallop ? 'rgba(16, 185, 129, 0.5)' : 'rgba(30, 41, 59, 0.25)';
    if (currentFilter === 'trot') return meta.hasTrot ? 'rgba(56, 189, 248, 0.5)' : 'rgba(30, 41, 59, 0.25)';
    return 'rgba(245, 158, 11, 0.5)';
}

fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
    .then(res => res.json())
    .then(countries => world.polygonsData(countries.features))
    .catch(err => console.error('Országhatár GeoJSON betöltési hiba:', err));

// ================================================================
// 4) VEZÉRLÉS - EGYSZERŰ, JÓL BEVÁLT BEÁLLÍTÁSOK
// Szándékosan nincs egyedi eseménykezelő-trükk (pl. auto-forgás
// leállítása kattintásra) - ez a szabványos three.js OrbitControls
// autoRotate + enableDamping kombináció, ami magától is helyesen
// kezeli a felhasználói húzást/nagyítást auto-forgás mellett.
// ================================================================
world.controls().autoRotate = true;
world.controls().autoRotateSpeed = 0.4;
world.controls().enableDamping = true;
world.controls().dampingFactor = 0.1;

// ================================================================
// 5) ORSZÁG KÖZÉPPONT SZÁMÍTÁSA A SAJÁT ADATAINKBÓL
// ================================================================
function getCountryCenter(iso) {
    const tracks = trackDatabase[iso];
    const avgLat = tracks.reduce((s, t) => s + t.lat, 0) / tracks.length;
    const avgLng = tracks.reduce((s, t) => s + t.lng, 0) / tracks.length;
    return { lat: avgLat, lng: avgLng };
}

// ================================================================
// 6) ÁTVÁLTÁS 3D FÖLDGÖMBRŐL 2D TÉRKÉPRE
// ================================================================
function goToCountry(iso) {
    currentIso = iso;
    const center = getCountryCenter(iso);

    document.getElementById('filterContainer').classList.add('disabled');
    document.getElementById('instructionBar').style.opacity = '0';

    world.pointOfView({ lat: center.lat, lng: center.lng, altitude: 0.35 }, 1600);

    setTimeout(() => showMap(iso), 1600);
}

// ================================================================
// 7) 2D LEAFLET TÉRKÉP
// ================================================================
let leafletMap = null;
let currentTileLayer = null;
let labelsLayer = null;
const markerLayerGroup = L.layerGroup();

const TILE_SATELLITE = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
const TILE_LABELS     = 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}';
const TILE_STREET     = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';

function initLeafletIfNeeded() {
    if (leafletMap) return;
    leafletMap = L.map('mapViz', { zoomControl: false, attributionControl: true }).setView([50, 10], 5);
    L.control.zoom({ position: 'bottomleft' }).addTo(leafletMap);
    markerLayerGroup.addTo(leafletMap);
    setBaseLayer('satellite');
}

function setBaseLayer(type) {
    initLeafletIfNeeded();

    if (currentTileLayer) leafletMap.removeLayer(currentTileLayer);
    if (labelsLayer) leafletMap.removeLayer(labelsLayer);

    document.getElementById('btnSatellite').classList.toggle('active', type === 'satellite');
    document.getElementById('btnStreet').classList.toggle('active', type === 'street');

    if (type === 'satellite') {
        currentTileLayer = L.tileLayer(TILE_SATELLITE, { attribution: 'Tiles &copy; Esri', maxZoom: 18 }).addTo(leafletMap);
        labelsLayer = L.tileLayer(TILE_LABELS, { maxZoom: 18 }).addTo(leafletMap);
    } else {
        currentTileLayer = L.tileLayer(TILE_STREET, { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }).addTo(leafletMap);
    }
}

function showMap(iso) {
    initLeafletIfNeeded();

    const tracks = trackDatabase[iso];
    const meta = countryMeta[iso] || { name: iso };

    document.getElementById('globeLayer').classList.add('hidden');
    document.getElementById('mapLayer').classList.add('visible');
    document.getElementById('backBtn').classList.add('visible');
    document.getElementById('layerToggle').classList.add('visible');

    const panel = document.getElementById('countryPanel');
    document.getElementById('panelTitle').textContent = meta.name;
    document.getElementById('panelSub').textContent = `${tracks.length} dokumentált versenypálya`;
    document.getElementById('panelTracks').innerHTML = tracks.map((t, idx) => {
        const status = t.status || "active";
        const statusColor = status === 'closed' ? '#ef4444' : (status === 'inactive' ? '#eab308' : '#22c55e');
        return `
        <div class="track-item" onclick="focusTrack(${idx})">
            <div class="t-name"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${statusColor};margin-right:6px;"></span>${t.name}</div>
            <div class="t-meta">${t.city}${t.founded ? ' · alapítva ' + t.founded : ''}</div>
            <div class="t-note">${t.note}</div>
        </div>
    `;
    }).join('');
    panel.classList.add('visible');
    panel.classList.remove('collapsed');

    markerLayerGroup.clearLayers();
    const bounds = [];
    tracks.forEach((t, idx) => {
        const icon = L.divIcon({ className: '', html: '<div class="track-marker"></div>', iconSize: [16, 16] });
        const marker = L.marker([t.lat, t.lng], { icon }).addTo(markerLayerGroup);
        marker.bindPopup(buildPopupHtml(t, meta));
        bounds.push([t.lat, t.lng]);
    });

    setTimeout(() => {
        leafletMap.invalidateSize();
        leafletMap.fitBounds(bounds, { padding: [60, 60] });
    }, 100);
}

// Egy pálya felugró adatlapjának felépítése: két fül -
// "Általános" (zászló, alapítás, hossz, szervezet, honlap) és
// "Történet és érdekességek" (a note mező szövege)
function buildPopupHtml(t, meta) {
    const lengthText = t.length ? `${t.length} m` : "nincs adat";

    // A pálya saját honlapja (ha van) külön sor.
    const ownSiteText = t.site
        ? `<a href="${t.site}" target="_blank" rel="noopener">${t.site.replace(/^https?:\/\//, '')}</a>`
        : "nincs saját honlap";

    const foundedText = t.founded ? t.founded : "nincs pontos adat";

    // Az országos szervezet honlapja MINDIG megjelenik, függetlenül attól,
    // hogy a pályának van-e saját oldala.
    const orgSiteText = meta.orgSite
        ? `<a href="${meta.orgSite}" target="_blank" rel="noopener">${meta.orgSite.replace(/^https?:\/\//, '')}</a>`
        : "nincs adat";

    // Státusz-ikon: zöld = aktív, sárga = inaktív/felfüggesztve, piros = végleg bezárt
    const statusLabels = { active: "Aktív", inactive: "Inaktív / felfüggesztve", closed: "Végleg bezárt" };
    const status = t.status || "active";
    const statusLabel = statusLabels[status] || "Aktív";

    return `
        <div class="popup-card">
            <span class="popup-status ${status}" title="${statusLabel}"></span>
            <span class="popup-flag">${meta.flag || ''}</span>
            <div class="popup-title">${t.name}</div>
            <div class="popup-tabs">
                <button class="popup-tab-btn active" onclick="switchPopupTab(this, 'general')">Általános</button>
                <button class="popup-tab-btn" onclick="switchPopupTab(this, 'history')">Történet</button>
            </div>
            <div class="popup-tab-content active" data-tab="general">
                <div class="popup-row"><b>Státusz:</b> ${statusLabel}</div>
                <div class="popup-row"><b>Település:</b> ${t.city}</div>
                <div class="popup-row"><b>Alapítás éve:</b> ${foundedText}</div>
                <div class="popup-row"><b>Pálya hossza:</b> ${lengthText}</div>
                <div class="popup-row"><b>Szervezet:</b> ${t.org}</div>
                <div class="popup-row"><b>Pálya honlapja:</b> ${ownSiteText}</div>
                <div class="popup-row"><b>${meta.orgSiteLabel || 'Országos szervezet'}:</b> ${orgSiteText}</div>
            </div>
            <div class="popup-tab-content" data-tab="history">
                <div class="popup-row">${t.note}</div>
            </div>
        </div>
    `;
}

// Fülváltás egy adott felugró adatlapon belül (csak azon a
// popup-kártyán belül vált, amelyikben a gombra kattintottak)
function switchPopupTab(btnEl, tabName) {
    const card = btnEl.closest('.popup-card');
    card.querySelectorAll('.popup-tab-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
    card.querySelectorAll('.popup-tab-content').forEach(c => {
        c.classList.toggle('active', c.dataset.tab === tabName);
    });
}

function focusTrack(idx) {
    const t = trackDatabase[currentIso][idx];
    leafletMap.setView([t.lat, t.lng], 11, { animate: true });
    markerLayerGroup.eachLayer(m => {
        const ll = m.getLatLng();
        if (Math.abs(ll.lat - t.lat) < 0.0001 && Math.abs(ll.lng - t.lng) < 0.0001) {
            m.openPopup();
        }
    });
    document.getElementById('countryPanel').classList.add('collapsed');
}

function togglePanelCollapse() {
    document.getElementById('countryPanel').classList.toggle('collapsed');
}

// ================================================================
// 8) SZŰRŐ

function setFilter(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    world.polygonsData(world.polygonsData());
}

// ================================================================
// 9) VISSZA A FÖLDGÖMBHÖZ
// ================================================================
function resetToGlobe() {
    currentIso = null;

    document.getElementById('mapLayer').classList.remove('visible');
    document.getElementById('globeLayer').classList.remove('hidden');
    document.getElementById('backBtn').classList.remove('visible');
    document.getElementById('layerToggle').classList.remove('visible');
    document.getElementById('countryPanel').classList.remove('visible');
    document.getElementById('filterContainer').classList.remove('disabled');
    document.getElementById('instructionBar').style.opacity = '1';

    world.pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 1400);
}
</script>
