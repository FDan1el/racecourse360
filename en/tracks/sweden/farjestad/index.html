(function(){

  var nyelv=document.documentElement.lang||'hu';
  function frissit(){
    var most=new Date();
    for(var i=0;i<elemek.length;i++){
      try{

          {timeZone:elemek[i].dataset.tz,hour:'2-digit',minute:'2-digit'}).format(most);

    /* A következő perc fordulójáig várunk, nem fix 60 másodpercet. */
    setTimeout(frissit,(60-most.getSeconds())*1000+50);
  }
  frissit();
})();
